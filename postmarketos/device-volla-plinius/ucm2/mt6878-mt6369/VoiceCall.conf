# The modem's speech codec is wired to the codec through the AFE: its
# downlink (PCM 1 capture) to the earpiece/speaker, the microphone to its
# uplink (PCM 1 playback). plinius-speechd follows these routes, turns the
# modem's speech path on and keeps the Hostless_Speech PCM running.
SectionVerb {
	EnableSequence [
		cset "name='ADDA_DL_CH1 DL0_CH1' 1"
		cset "name='ADDA_DL_CH2 DL0_CH2' 1"
		cset "name='VUL9_CH1 ADDA_UL_CH1' 1"
		cset "name='VUL9_CH2 ADDA_UL_CH2' 1"
		cset "name='PCM_1_PB_CH1 ADDA_UL_CH1' 1"
		cset "name='PCM_1_PB_CH2 ADDA_UL_CH2' 1"
		cset "name='ADDA_DL_CH1 PCM_1_CAP_CH1' 1"
		cset "name='ADDA_DL_CH2 PCM_1_CAP_CH1' 1"
	]
	DisableSequence [
		# back to 0 dB for media playback
		cset "name='ADDA DL Playback Volume' 41"
		cset "name='ADDA_DL_CH2 PCM_1_CAP_CH1' 0"
		cset "name='ADDA_DL_CH1 PCM_1_CAP_CH1' 0"
		cset "name='PCM_1_PB_CH2 ADDA_UL_CH2' 0"
		cset "name='PCM_1_PB_CH1 ADDA_UL_CH1' 0"
		cset "name='VUL9_CH2 ADDA_UL_CH2' 0"
		cset "name='VUL9_CH1 ADDA_UL_CH1' 0"
		cset "name='ADDA_DL_CH2 DL0_CH2' 0"
		cset "name='ADDA_DL_CH1 DL0_CH1' 0"
	]
	Value {
		TQ "Voice"
	}
}

# a call starts on the earpiece
Define.EarpiecePriority 400
Include.devices.File "devices.conf"
