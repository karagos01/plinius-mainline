# Output and input devices shared by the HiFi and Voice Call verbs.
# The earpiece and the loudspeaker are two aw87565 amplifiers, each behind
# its own DAPM switch. The loudspeaker amp is fed from the codec line output
# ("Lineout" gain), the earpiece amp from the receiver output ("Receiver"
# gain).

SectionDevice."Speaker" {
	Comment "Loudspeaker"
	ConflictingDevice [
		"Earpiece"
	]
	EnableSequence [
		cset "name='Speaker Switch Switch' 1"
	]
	DisableSequence [
		cset "name='Speaker Switch Switch' 0"
	]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 300
		PlaybackMixerElem "Lineout"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='Receiver Switch Switch' 1"
	]
	DisableSequence [
		cset "name='Receiver Switch Switch' 0"
	]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority "${var:EarpiecePriority}"
		PlaybackMixerElem "Receiver"
	}
}

SectionDevice."Mic" {
	Comment "Microphone"
	Value {
		CapturePCM "hw:${CardId},1"
		CapturePriority 100
	}
}
