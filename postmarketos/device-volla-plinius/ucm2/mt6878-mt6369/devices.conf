# Output and input devices shared by the HiFi and Voice Call verbs.
# The earpiece and the loudspeaker are two aw87565 amplifiers on the same
# codec line output, each behind its own DAPM switch.

SectionDevice."Speaker" {
	Comment "Loudspeaker"
	ConflictingDevice [
		"Earpiece"
	]
	EnableSequence [
		cset "name='Speaker Switch Switch' 1"
	]
	DisableSequence [
		cset "name='Speaker Switch Switch' 0"
	]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 300
		PlaybackMixerElem "Lineout"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='Receiver Switch Switch' 1"
	]
	DisableSequence [
		cset "name='Receiver Switch Switch' 0"
	]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority "${var:EarpiecePriority}"
		PlaybackMixerElem "Lineout"
	}
}

SectionDevice."Mic" {
	Comment "Microphone"
	Value {
		CapturePCM "hw:${CardId},1"
		CapturePriority 100
	}
}
