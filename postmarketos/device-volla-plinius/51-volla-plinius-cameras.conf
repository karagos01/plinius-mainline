# Volla Phone Plinius cameras: both back cameras are located at the back,
# tell them apart.
monitor.libcamera.rules = [
  {
    matches = [
      {
        node.name = "libcamera_input._base_soc_0_i2c_11c22000_camera_36"
      }
    ]
    actions = {
      update-props = {
        node.description = "Back Camera (64 MP)"
      }
    }
  }
  {
    matches = [
      {
        node.name = "libcamera_input._base_soc_0_i2c_11e02000_camera_31"
      }
    ]
    actions = {
      update-props = {
        node.description = "Back Camera (8 MP)"
      }
    }
  }
]
