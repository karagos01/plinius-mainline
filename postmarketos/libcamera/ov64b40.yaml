%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
  - Awb:
  - Adjust:
  - Agc:
  - Af:
options:
  # Debayering the full 4624x3472 frame is slow and its buffers do not fit
  # the CMA area next to the raw frames. 1916x1076 is the largest output of
  # the 1920x1080 sensor mode, which then gets picked over the full one.
  max_output_width: 1916
  max_output_height: 1076
...
